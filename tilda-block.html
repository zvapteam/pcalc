<div id="pcalc"></div>
<script>
  /* Калькулятор смет. Настройки — здесь, код — в репозитории github.com/zvapteam/pcalc.
     Чтобы обновить калькулятор, поменяйте VERSION на новый номер и опубликуйте страницу.
     Чтобы откатиться, верните прежний номер. */
  window.PCALC_CONFIG = {
    API_URL: '...',
    API_KEY: '...',
    DEFAULT_MARGIN: 70,
    DEFAULT_TAX: 9,
    DEFAULT_CONT: 20
  };
  (function () {
    var VERSION = '4.7';
    var base = 'https://cdn.jsdelivr.net/gh/zvapteam/pcalc@release-' + VERSION + '/';
    var f = document.createElement('link');
    f.rel = 'stylesheet';
    f.href = 'https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap';
    document.head.appendChild(f);
    var c = document.createElement('link');
    c.rel = 'stylesheet'; c.href = base + 'calc.css';
    document.head.appendChild(c);
    var s = document.createElement('script');
    s.src = base + 'calc.js';
    s.onerror = function () {
      document.getElementById('pcalc').textContent = 'Не удалось загрузить калькулятор версии ' + VERSION + '. Проверьте номер версии или подключение к интернету.';
    };
    document.body.appendChild(s);
  })();
</script>
